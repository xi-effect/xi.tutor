appId: ru.sovlium.electron.dev
productName: sovlium
copyright: Copyright © sovlium
asar: true
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../xi.web/build
    to: web
extraMetadata:
  main: out/main/index.js
npmRebuild: false
electronLanguages:
  - en
  - ru
mac:
  category: public.app-category.education
  icon: resources/icons/icon.icns
  # Ad-hoc signature: an unsigned bundle downloaded from the internet is
  # reported by Gatekeeper as "damaged" on Apple Silicon.
  # TODO: after the Apple Developer certificate is available, set the signing
  # identity, turn hardenedRuntime back on, and enable notarization.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: sovlium uses the camera for video lessons.
    NSMicrophoneUsageDescription: sovlium uses the microphone for video lessons.
    NSScreenCaptureUsageDescription: sovlium captures the screen when you share it in a lesson.
    NSAudioCaptureUsageDescription: sovlium records computer audio during a lesson.
    NSUserNotificationsUsageDescription: sovlium shows lesson and message notifications.
    CFBundleURLTypes:
      - CFBundleURLName: sovlium
        CFBundleURLSchemes:
          - sovlium
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  icon: resources/icons/icon.ico
  # TODO: remove after Windows code signing is configured.
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: sovlium
  uninstallDisplayName: sovlium
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: xi-effect
  repo: xi.tutor
  releaseType: draft
  tagNamePrefix: electron-v
