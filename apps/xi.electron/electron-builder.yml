appId: ru.sovlium.electron.dev
productName: Sovlium
copyright: Copyright © Sovlium
asar: true
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../xi.web/build
    to: web
extraMetadata:
  main: out/main/index.js
npmRebuild: false
electronLanguages:
  - en
  - ru
mac:
  category: public.app-category.education
  icon: resources/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Sovlium uses the camera for video lessons.
    NSMicrophoneUsageDescription: Sovlium uses the microphone for video lessons.
    NSScreenCaptureUsageDescription: Sovlium captures the screen when you share it in a lesson.
    NSUserNotificationsUsageDescription: Sovlium shows lesson and message notifications.
    CFBundleURLTypes:
      - CFBundleURLName: Sovlium
        CFBundleURLSchemes:
          - sovlium
  target:
    - dmg
    - dir
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: Sovlium
  uninstallDisplayName: Sovlium
  artifactName: ${productName}-Setup-${version}.${ext}
publish: null
