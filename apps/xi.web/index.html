    <!-- Перехват beforeinstallprompt до загрузки приложения, иначе событие можно пропустить -->
    <script>
      window.__beforeInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();

    <!--
      Не @import из основного CSS: пока fonts.googleapis.com не ответит,
      браузер не применяет stylesheet и не запускает type=module.
      media=print не блокирует парсер, onload включает шрифт после ответа.
    -->
    <link

      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      media="print"
      onload="this.media='all'"

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fa;
      }
      html[data-theme='dark'] #boot-splash {
        background: #111318;
      }
      #boot-splash span {
        box-sizing: border-box;
        width: 24px;
        height: 24px;
        border: 3px solid #5c5fd1;
        border-top-color: transparent;
        border-radius: 999px;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #root:not(:empty) ~ #boot-splash {
        display: none;
      }
    </style>

    <script>
      (function () {
        var themeKey = 'sovlium-theme';
        var chosenKey = 'sovlium-theme-chosen';
        var languageKey = 'xi_language';
        var stored = null;
        var chosen = false;
        var language = 'ru';

        try {
          stored = localStorage.getItem(themeKey);
          chosen = localStorage.getItem(chosenKey) === '1';
          var storedLanguage = localStorage.getItem(languageKey);
          if (storedLanguage === 'en' || storedLanguage === 'ru') {
            language = storedLanguage;
          }
        } catch (e) {}

        var isNative = !!(window.__SOVLIUM_NATIVE__ || window.__SOVLIUM_ELECTRON__);
        var injected = document.documentElement.getAttribute('data-theme');
        var preference =
          chosen && (stored === 'light' || stored === 'dark')
            ? stored
            : isNative && (injected === 'light' || injected === 'dark')
              ? injected
              : 'light';

        document.documentElement.setAttribute('data-theme', preference);
        document.documentElement.setAttribute('data-theme-preference', preference);
        document.documentElement.lang = language;
      })();
    </script>

    <script>
      // Если entry-чанк 404 (протухший index.html после деплоя), JS приложения
      // не стартует и installStaleChunkReload не успевает. Ключ совпадает с
      // STALE_CHUNK_RELOAD_KEY в common.utils.
      (function () {
        var key = 'stale-chunk-reload-at';
        var cooldownMs = 15000;
        var reloadOnce = function () {
          try {
            var now = Date.now();
            var last = Number(sessionStorage.getItem(key) || 0);
            if (last > 0 && now - last < cooldownMs) return;
            sessionStorage.setItem(key, String(now));
          } catch (e) {
            return;
          }
          window.location.reload();
        };
        var appHasPainted = function () {
          var root = document.getElementById('root');
          return !!(root && root.childElementCount > 0);
        };
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module' || !el.src) return;
            reloadOnce();
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var message = (reason && (reason.message || String(reason))) || '';
          if (
            /dynamically imported module|module script failed|failed to load module script|unable to preload css/i.test(
              message,
            )
          ) {
            reloadOnce();
          }
        });
        // Смена service worker посреди загрузки на iOS обрывает модули
        // и оставляет пустой экран часто без error.
        if (navigator.serviceWorker) {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (appHasPainted()) return;
            reloadOnce();
          });
        }
        var isNative = !!(window.__SOVLIUM_NATIVE__ || window.__SOVLIUM_ELECTRON__);
        if (!isNative) {
          // Отдельный ключ и одна попытка за сессию: общий cooldown 15с
          // короче этого таймера, и страница перезагружалась бы бесконечно.
          var watchdogKey = 'boot-watchdog-reload';
          window.setTimeout(function () {
            if (appHasPainted()) {
              try {
                sessionStorage.removeItem(watchdogKey);
              } catch (e) {}
              return;
            }
            try {
              if (sessionStorage.getItem(watchdogKey) === '1') return;
              sessionStorage.setItem(watchdogKey, '1');
            } catch (e) {
              return;
            }
            window.location.reload();
          }, 25000);
        }
      })();
    </script>
