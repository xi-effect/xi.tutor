      window.__beforeInstallPrompt = null;

    <script>
      (function () {
        var themeKey = 'sovlium-theme';
        var chosenKey = 'sovlium-theme-chosen';
        var languageKey = 'xi_language';
        var stored = null;
        var chosen = false;
        var language = 'ru';

        try {
          stored = localStorage.getItem(themeKey);
          chosen = localStorage.getItem(chosenKey) === '1';
          var storedLanguage = localStorage.getItem(languageKey);
          if (storedLanguage === 'en' || storedLanguage === 'ru') {
            language = storedLanguage;
          }
        } catch (e) {}

        var isNative = !!(window.__SOVLIUM_NATIVE__ || window.__SOVLIUM_ELECTRON__);
        var injected = document.documentElement.getAttribute('data-theme');
        var preference =
          chosen && (stored === 'light' || stored === 'dark')
            ? stored
            : isNative && (injected === 'light' || injected === 'dark')
              ? injected
              : 'light';

        document.documentElement.setAttribute('data-theme', preference);
        document.documentElement.setAttribute('data-theme-preference', preference);
        document.documentElement.lang = language;
      })();
    </script>

    <script>
      // Если entry-чанк 404 (протухший index.html после деплоя), JS приложения
      // не стартует и installStaleChunkReload не успевает. Ключ совпадает с
      // STALE_CHUNK_RELOAD_KEY в common.utils.
      (function () {
        var key = 'stale-chunk-reload-at';
        var cooldownMs = 15000;
        var reloadOnce = function () {
          try {
            var now = Date.now();
            var last = Number(sessionStorage.getItem(key) || 0);
            if (last > 0 && now - last < cooldownMs) return;
            sessionStorage.setItem(key, String(now));
          } catch (e) {
            return;
          }
          window.location.reload();
        };
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module' || !el.src) return;
            reloadOnce();
          },
          true,
        );
      })();
    </script>
