name: Common Build Steps

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm (version from package.json)
        uses: pnpm/action-setup@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install turbo
        run: pnpm install -g turbo

      - name: Turbo prune
        run: turbo prune --scope=${{ inputs.app_name }}

      - name: Install dependencies
        working-directory: ./out
        run: pnpm install

      - name: Runner diagnostics before build
        working-directory: ./out
        run: |
          echo "================ SYSTEM ================"
          uname -a
          echo

          echo "================ CPU ==================="
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)'
          echo

          echo "================ MEMORY ================"
          free -h
          echo

          echo "================ MEMORY PRESSURE ========"
          cat /proc/pressure/memory 2>/dev/null || true
          echo

          echo "================ DISK =================="
          df -h
          echo

          echo "================ DIRECTORY SIZE ========"
          du -sh . || true
          du -sh node_modules || true
          echo

          echo "================ VERSIONS =============="
          node --version
          pnpm --version
          turbo --version
          pnpm --filter=${{ inputs.app_name }} exec vite --version || true
          echo

          echo "================ LIMITS ================="
          ulimit -a
          echo

          echo "================ CGROUP MEMORY =========="
          if [ -f /sys/fs/cgroup/memory.max ]; then
            echo -n "memory.max: "
            cat /sys/fs/cgroup/memory.max
          fi

          if [ -f /sys/fs/cgroup/memory.current ]; then
            echo -n "memory.current: "
            cat /sys/fs/cgroup/memory.current
          fi

          if [ -f /sys/fs/cgroup/memory.swap.max ]; then
            echo -n "memory.swap.max: "
            cat /sys/fs/cgroup/memory.swap.max
          fi

          if [ -f /sys/fs/cgroup/memory.events ]; then
            echo
            echo "memory.events:"
            cat /sys/fs/cgroup/memory.events
          fi

      - name: Build application
        working-directory: ./out
        env:
          # Ограничиваем JS old-space.
          #
          # Важно: RSS Vite в наших логах значительно превышает этот лимит,
          # поэтому большая часть роста, вероятно, происходит не только
          # внутри обычного V8 old-space.
          NODE_OPTIONS: --max-old-space-size=4096

          TURBO_UI: "0"

          # Inspector пока не используем, чтобы не влиять
          # на transform pipeline и потребление памяти.
          VITE_BUILD_INSPECT: "0"

          # Подробный trace JS <-> Rolldown N-API boundary.
          RD_LOG: "napi=trace"

        run: |
          set -o pipefail

          APP="${{ inputs.app_name }}"

          RESOURCE_LOG="$PWD/resource-monitor.log"
          BUILD_LOG="$PWD/build-debug.log"

          echo "============================================================"
          echo "VITE BUILD DIAGNOSTICS V4"
          echo "============================================================"
          echo
          echo "App: $APP"
          echo "Resource log: $RESOURCE_LOG"
          echo "Build log: $BUILD_LOG"
          echo "RD_LOG: $RD_LOG"
          echo

          (
            while true; do
              {
                echo
                echo "============================================================"
                echo "RESOURCE SNAPSHOT: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "============================================================"

                echo
                echo "--- Memory ---"
                free -h

                echo
                echo "--- Memory pressure ---"
                cat /proc/pressure/memory 2>/dev/null || true

                echo
                echo "--- /proc/meminfo ---"
                grep -E \
                  'MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapCached|SwapTotal|SwapFree|Slab|SReclaimable|SUnreclaim' \
                  /proc/meminfo || true

                echo
                echo "--- Top processes by RAM ---"
                ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,cmd \
                  --sort=-rss \
                  | head -25 || true

                echo
                echo "--- Top processes by CPU ---"
                ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,cmd \
                  --sort=-%cpu \
                  | head -15 || true

                #
                # Детальная память самого vite build.
                #
                VITE_PID="$(pgrep -f 'node .*/vite build' | head -1 || true)"

                if [ -n "$VITE_PID" ] && [ -d "/proc/$VITE_PID" ]; then
                  echo
                  echo "--- Vite process memory details (PID $VITE_PID) ---"

                  grep -E \
                    'Name|Pid|PPid|VmPeak|VmSize|VmRSS|RssAnon|RssFile|RssShmem|VmData|VmSwap|Threads' \
                    "/proc/$VITE_PID/status" || true

                  if [ -f "/proc/$VITE_PID/smaps_rollup" ]; then
                    echo
                    echo "--- Vite smaps rollup ---"

                    grep -E \
                      'Rss:|Pss:|Pss_Anon:|Pss_File:|Pss_Shmem:|Shared_Clean:|Shared_Dirty:|Private_Clean:|Private_Dirty:|Anonymous:|Swap:|SwapPss:' \
                      "/proc/$VITE_PID/smaps_rollup" || true
                  fi

                  echo
                  echo "--- Vite file descriptors ---"

                  if [ -d "/proc/$VITE_PID/fd" ]; then
                    echo -n "FD count: "
                    find "/proc/$VITE_PID/fd" -maxdepth 1 -type l 2>/dev/null \
                      | wc -l || true
                  fi
                else
                  echo
                  echo "--- Vite process ---"
                  echo "vite build process not running yet"
                fi

                echo
                echo "--- Disk ---"
                df -h /

                if [ -f /sys/fs/cgroup/memory.current ]; then
                  echo
                  echo "--- Cgroup memory ---"

                  echo -n "current: "
                  cat /sys/fs/cgroup/memory.current

                  echo -n "max: "
                  cat /sys/fs/cgroup/memory.max

                  if [ -f /sys/fs/cgroup/memory.swap.current ]; then
                    echo -n "swap.current: "
                    cat /sys/fs/cgroup/memory.swap.current
                  fi

                  if [ -f /sys/fs/cgroup/memory.swap.max ]; then
                    echo -n "swap.max: "
                    cat /sys/fs/cgroup/memory.swap.max
                  fi

                  if [ -f /sys/fs/cgroup/memory.events ]; then
                    echo
                    echo "memory.events:"
                    cat /sys/fs/cgroup/memory.events
                  fi
                fi
              } 2>&1 | tee -a "$RESOURCE_LOG"

              # Чуть чаще предыдущих 15 секунд:
              # нам интересен момент непосредственно перед резким ростом/падением.
              sleep 10
            done
          ) &

          MONITOR_PID=$!

          cleanup() {
            echo
            echo "Stopping resource monitor (PID $MONITOR_PID)..."
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo
          echo "============================================================"
          echo "STARTING BUILD"
          echo "============================================================"
          echo

          #
          # Для xi.web временно запускаем typecheck и Vite отдельно.
          #
          # Причина:
          #
          # package.json:
          #   "build": "tsc -b && vite build"
          #
          # Нам нужен CLI-флаг именно для Vite:
          #   vite build --debug plugin-transform
          #
          # Через turbo -> pnpm script он передаётся неоднозначно,
          # поэтому на время диагностики исключаем этот слой.
          #
          if [ "$APP" = "xi.web" ]; then
            {
              echo
              echo "============================================================"
              echo "PHASE 1: TYPESCRIPT"
              echo "============================================================"
              echo

              pnpm --filter="$APP" exec tsc -b

              echo
              echo "============================================================"
              echo "PHASE 2: VITE"
              echo "============================================================"
              echo

              pnpm --filter="$APP" exec vite build \
                --debug plugin-transform

            } 2>&1 | tee "$BUILD_LOG"

          else
            #
            # Для остальных приложений оставляем обычный путь.
            #
            pnpm run build \
              --filter="$APP" \
              --log-order=stream \
              --env-mode=loose \
              2>&1 | tee "$BUILD_LOG"
          fi

      - name: Summarize build diagnostics
        if: always()
        working-directory: ./out
        run: |
          echo "================ DEBUG LOG SIZE =========="
          ls -lh build-debug.log resource-monitor.log 2>/dev/null || true
          echo

          echo "================ LAST BUILD OUTPUT ========"
          tail -200 build-debug.log 2>/dev/null || true
          echo

          echo "================ VITE PLUGIN TRANSFORMS ==="

          if [ -f build-debug.log ]; then
            grep -E \
              'vite:plugin-transform|plugin-transform' \
              build-debug.log \
              > vite-plugin-transform.log || true

            echo -n "plugin-transform lines: "
            wc -l < vite-plugin-transform.log 2>/dev/null || echo 0

            echo
            echo "--- Last plugin-transform entries ---"
            tail -200 vite-plugin-transform.log 2>/dev/null || true
          fi

          echo
          echo "================ ROLLDOWN NAPI ============"

          if [ -f build-debug.log ]; then
            grep -E \
              '(^|[[:space:]])(TRACE|DEBUG)[[:space:]]+napi:|napi:' \
              build-debug.log \
              > rolldown-napi.log || true

            echo -n "NAPI trace lines: "
            wc -l < rolldown-napi.log 2>/dev/null || echo 0

            echo
            echo "--- Last NAPI calls ---"
            tail -300 rolldown-napi.log 2>/dev/null || true
          fi

          echo
          echo "================ TRANSFORM TAIL ==========="

          if [ -f build-debug.log ]; then
            grep -Ei \
              'transform|load|resolve|plugin' \
              build-debug.log \
              | tail -300 \
              > transform-tail.log || true

            cat transform-tail.log 2>/dev/null || true
          fi

      - name: Diagnostics after build
        if: always()
        working-directory: ./out
        run: |
          echo "================ FINAL MEMORY ==========="
          free -h
          echo

          echo "================ FINAL MEMORY PRESSURE =="
          cat /proc/pressure/memory 2>/dev/null || true
          echo

          echo "================ FINAL MEMINFO ==========="
          grep -E \
            'MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapCached|SwapTotal|SwapFree|Slab|SReclaimable|SUnreclaim' \
            /proc/meminfo || true
          echo

          echo "================ CGROUP EVENTS ==========="

          if [ -f /sys/fs/cgroup/memory.events ]; then
            cat /sys/fs/cgroup/memory.events
          fi

          echo

          if [ -f /sys/fs/cgroup/memory.current ]; then
            echo -n "memory.current: "
            cat /sys/fs/cgroup/memory.current
          fi

          if [ -f /sys/fs/cgroup/memory.max ]; then
            echo -n "memory.max: "
            cat /sys/fs/cgroup/memory.max
          fi

          if [ -f /sys/fs/cgroup/memory.swap.current ]; then
            echo -n "memory.swap.current: "
            cat /sys/fs/cgroup/memory.swap.current
          fi

          if [ -f /sys/fs/cgroup/memory.swap.max ]; then
            echo -n "memory.swap.max: "
            cat /sys/fs/cgroup/memory.swap.max
          fi

          echo
          echo "================ KERNEL OOM INFO ========="

          dmesg 2>/dev/null \
            | grep -Ei \
              'out of memory|oom|killed process|memory cgroup' \
            | tail -100 || true

          echo
          echo "================ FINAL DISK ============="
          df -h
          echo

          echo "================ TOP PROCESSES BY RAM ===="
          ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,cmd \
            --sort=-rss \
            | head -30 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ./out/build-debug.log
            ./out/resource-monitor.log
            ./out/vite-plugin-transform.log
            ./out/rolldown-napi.log
            ./out/transform-tail.log
            ./out/**/*.cpuprofile
            ./out/**/*.heapsnapshot
            ./out/**/*.heapprofile

      - name: Upload build as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}
          path: ./out/apps/${{ inputs.app_name }}/build
