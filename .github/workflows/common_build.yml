name: Common Build Steps

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm (version from package.json)
        uses: pnpm/action-setup@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install turbo
        run: pnpm install -g turbo

      - name: Turbo prune
        run: turbo prune --scope=${{ inputs.app_name }}

      - name: Install dependencies
        working-directory: ./out
        run: pnpm install

      - name: Runner diagnostics before build
        working-directory: ./out
        run: |
          echo "================ SYSTEM ================"
          uname -a
          echo

          echo "================ CPU ==================="
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)'
          echo

          echo "================ MEMORY ================"
          free -h
          echo

          echo "================ DISK =================="
          df -h
          echo

          echo "================ DIRECTORY SIZE ========"
          du -sh . || true
          du -sh node_modules || true
          echo

          echo "================ VERSIONS =============="
          node --version
          pnpm --version
          turbo --version
          echo

          echo "================ LIMITS ================="
          ulimit -a
          echo

          echo "================ CGROUP MEMORY =========="
          if [ -f /sys/fs/cgroup/memory.max ]; then
            echo -n "memory.max: "
            cat /sys/fs/cgroup/memory.max
          fi

          if [ -f /sys/fs/cgroup/memory.current ]; then
            echo -n "memory.current: "
            cat /sys/fs/cgroup/memory.current
          fi

          if [ -f /sys/fs/cgroup/memory.swap.max ]; then
            echo -n "memory.swap.max: "
            cat /sys/fs/cgroup/memory.swap.max
          fi

      - name: Build application
        working-directory: ./out
        env:
          # Оставляем 4 GB именно для V8 old-space.
          # Общий RSS Vite/Rolldown при проблеме растёт значительно выше.
          NODE_OPTIONS: --max-old-space-size=4096

          # Отключаем интерактивный Turbo UI.
          TURBO_UI: "0"

          # Inspector на этом прогоне выключаем:
          # он сам собирает информацию о transform pipeline
          # и может влиять на потребление памяти.
          VITE_BUILD_INSPECT: "0"

          # Vite diagnostic logging.
          DEBUG: vite:plugin-transform

        run: |
          set -o pipefail

          RESOURCE_LOG="$PWD/resource-monitor.log"
          BUILD_LOG="$PWD/build-debug.log"

          echo "============================================================"
          echo "VITE BUILD DIAGNOSTICS V3"
          echo "============================================================"
          echo
          echo "Starting resource monitor..."
          echo "Resource log: $RESOURCE_LOG"
          echo "Build log: $BUILD_LOG"
          echo

          (
            while true; do
              {
                echo
                echo "============================================================"
                echo "RESOURCE SNAPSHOT: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "============================================================"

                echo
                echo "--- Memory ---"
                free -h

                echo
                echo "--- /proc/meminfo ---"
                grep -E \
                  'MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapCached|SwapTotal|SwapFree|Slab|SReclaimable|SUnreclaim' \
                  /proc/meminfo || true

                echo
                echo "--- Top processes by RAM ---"
                ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,cmd \
                  --sort=-rss \
                  | head -25

                echo
                echo "--- Top processes by CPU ---"
                ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,cmd \
                  --sort=-%cpu \
                  | head -15

                #
                # Детальная память непосредственно процесса Vite.
                #
                VITE_PID="$(pgrep -f 'node .*/vite build' | head -1 || true)"

                if [ -n "$VITE_PID" ] && [ -d "/proc/$VITE_PID" ]; then
                  echo
                  echo "--- Vite process memory details (PID $VITE_PID) ---"

                  grep -E \
                    'Name|Pid|PPid|VmPeak|VmSize|VmRSS|RssAnon|RssFile|RssShmem|VmData|VmSwap|Threads' \
                    "/proc/$VITE_PID/status" || true

                  if [ -f "/proc/$VITE_PID/smaps_rollup" ]; then
                    echo
                    echo "--- Vite smaps rollup ---"

                    grep -E \
                      'Rss:|Pss:|Pss_Anon:|Pss_File:|Pss_Shmem:|Shared_Clean:|Shared_Dirty:|Private_Clean:|Private_Dirty:|Anonymous:|Swap:|SwapPss:' \
                      "/proc/$VITE_PID/smaps_rollup" || true
                  fi
                else
                  echo
                  echo "--- Vite process ---"
                  echo "vite build process not running yet"
                fi

                echo
                echo "--- Disk ---"
                df -h /

                if [ -f /sys/fs/cgroup/memory.current ]; then
                  echo
                  echo "--- Cgroup memory ---"

                  echo -n "current: "
                  cat /sys/fs/cgroup/memory.current

                  echo -n "max: "
                  cat /sys/fs/cgroup/memory.max

                  if [ -f /sys/fs/cgroup/memory.swap.current ]; then
                    echo -n "swap.current: "
                    cat /sys/fs/cgroup/memory.swap.current
                  fi

                  if [ -f /sys/fs/cgroup/memory.swap.max ]; then
                    echo -n "swap.max: "
                    cat /sys/fs/cgroup/memory.swap.max
                  fi

                  if [ -f /sys/fs/cgroup/memory.events ]; then
                    echo
                    echo "memory.events:"
                    cat /sys/fs/cgroup/memory.events
                  fi
                fi
              } 2>&1 | tee -a "$RESOURCE_LOG"

              sleep 15
            done
          ) &

          MONITOR_PID=$!

          cleanup() {
            echo
            echo "Stopping resource monitor (PID $MONITOR_PID)..."
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo
          echo "============================================================"
          echo "STARTING BUILD"
          echo "============================================================"
          echo

          # В CI Turbo по умолчанию группирует task logs.
          # --log-order=stream заставляет показывать вывод Vite сразу.
          #
          # --env-mode=loose нужен только для диагностического прогона,
          # чтобы DEBUG точно дошёл до Vite через Turbo.
          pnpm run build \
            --filter=${{ inputs.app_name }} \
            --log-order=stream \
            --env-mode=loose \
            2>&1 | tee "$BUILD_LOG"

      - name: Diagnostics after build
        if: always()
        working-directory: ./out
        run: |
          echo "================ FINAL MEMORY ==========="
          free -h
          echo

          echo "================ FINAL MEMINFO ==========="
          grep -E \
            'MemTotal|MemFree|MemAvailable|Buffers|Cached|SwapCached|SwapTotal|SwapFree|Slab|SReclaimable|SUnreclaim' \
            /proc/meminfo || true
          echo

          echo "================ CGROUP EVENTS ==========="

          if [ -f /sys/fs/cgroup/memory.events ]; then
            cat /sys/fs/cgroup/memory.events
          fi

          echo

          if [ -f /sys/fs/cgroup/memory.current ]; then
            echo -n "memory.current: "
            cat /sys/fs/cgroup/memory.current
          fi

          if [ -f /sys/fs/cgroup/memory.max ]; then
            echo -n "memory.max: "
            cat /sys/fs/cgroup/memory.max
          fi

          if [ -f /sys/fs/cgroup/memory.swap.current ]; then
            echo -n "memory.swap.current: "
            cat /sys/fs/cgroup/memory.swap.current
          fi

          if [ -f /sys/fs/cgroup/memory.swap.max ]; then
            echo -n "memory.swap.max: "
            cat /sys/fs/cgroup/memory.swap.max
          fi

          echo
          echo "================ FINAL DISK ============="
          df -h
          echo

          echo "================ TOP PROCESSES BY RAM ===="
          ps -eo pid,ppid,rss,vsz,%mem,%cpu,etime,cmd \
            --sort=-rss \
            | head -30

          echo
          echo "================ DIAGNOSTIC FILES ========"

          find . \
            \( \
              -name '.vite-inspect' \
              -o -name '*.cpuprofile' \
              -o -name '*.heapsnapshot' \
              -o -name '*.heapprofile' \
            \) \
            -print 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ./out/build-debug.log
            ./out/resource-monitor.log
            ./out/**/.vite-inspect/**
            ./out/**/*.cpuprofile
            ./out/**/*.heapsnapshot
            ./out/**/*.heapprofile

      - name: Upload build as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.app_name }}
          path: ./out/apps/${{ inputs.app_name }}/build
