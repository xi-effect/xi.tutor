name: Common Push Steps

on:
  workflow_call:
    inputs:
      project_name:
        type: string
        required: true
      app_name:
        type: string
        required: true
      base_deployment_path:
        type: string
        required: false
      deployment_name:
        type: string
        required: true
      github_environment_name:
        type: string
        required: true
    secrets:
      SSH_HOST:
        required: false
      SSH_PORT:
        required: false
      SSH_USER:
        required: false
      SSH_PRIVATE_KEY:
        required: false
      SSH_KEY_PASSWORD:
        required: false
      DISCORD_WEBHOOK:
        required: false

env:
  deployment_path: ${{ inputs.project_name }}/${{ inputs.app_name }}/${{ inputs.deployment_name }}

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment_name }}

    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app_name }}
          path: out

      - name: Create directory structure to copy
        run: mkdir -p ${{ env.deployment_path }}

      - name: Create directories on remote
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: --verbose --human-readable --recursive --relative --dirs
          path: ./${{ env.deployment_path }}
          remote_path: ${{ inputs.base_deployment_path }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASSWORD }}

      # nginx отдаёт из secondary то, чего нет в primary. Там лежит предыдущая
      # сборка: во время заливки она закрывает пропуски в primary, а после —
      # отдаёт старые чанки вкладкам и service worker со старыми хэшами.
      # Без index.html в primary сайт держится на secondary, его не трогаем.
      - name: Keep previous build in the secondary source
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_DIR: ${{ inputs.base_deployment_path }}/${{ env.deployment_path }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSWORD }}
          envs: DEPLOY_DIR
          script_stop: true
          script: |-
            dir="$DEPLOY_DIR"
            case "$dir" in "~/"*) dir="$HOME/${dir#\~/}" ;; esac
            mkdir -p "$dir/primary" "$dir/secondary"
            cd "$dir"
            if [ -f primary/index.html ]; then
              rsync -a --delete primary/ secondary/
            fi

      # --delay-updates: новые файлы подменяются разом в конце, а не по одному
      # во время заливки, когда index.html и чанки могут быть из разных сборок.
      - name: Push files to the primary source
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: --verbose --human-readable --compress --recursive --delete-after --delay-updates
          path: ./out/*
          remote_path: ${{ inputs.base_deployment_path }}/${{ env.deployment_path }}/primary
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_key_pass: ${{ secrets.SSH_KEY_PASSWORD }}
