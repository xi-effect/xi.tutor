name: Electron release

on:
  push:
    tags:
      - 'electron-v*'

permissions:
  contents: write

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            publish_script: build:publish:windows
          - os: macos-latest
            publish_script: build:publish:macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches xi.electron version
        run: node apps/xi.electron/scripts/check-release-tag.mjs

      - name: Ensure one draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#electron-v}"
          REPO="xi-effect/xi.tutor"
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              exit 0
            fi
            if gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Sovlium ${VERSION}" \
              --notes "Electron ${VERSION}. Publish this draft after the Windows and macOS assets are attached."; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          gh release view "$TAG" --repo "$REPO"

      - name: Build xi.web and xi.electron, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=4096
          SOVLIUM_BUILD_SHA: ${{ github.sha }}
        run: pnpm --filter xi.electron ${{ matrix.publish_script }}
